<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tortas Mary">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Tortas Mary · Turnos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #fdf6ee; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #8a7566; background: #ffffff; }
  #cargando img { width: 120px; height: auto; }
  #cargando.oculto { display: none; }
</style>
</head>
<body>
<div id="cargando"><img src="icon-512.png" alt="Tortas Mary"><span>Cargando…</span></div>
<iframe id="app" title="Turnos Tortas Mary" allow="clipboard-write"></iframe>
<script>
// Link de la app de Apps Script (Implementar → Administrar implementaciones → URL de la aplicación web).
// Si algún día cambia, solo hay que cambiar esta línea.
const APP_URL = 'https://script.google.com/macros/s/AKfycbz_vPFBDvveEZ1Q-_NCHfDrlOyWLJIGkYx7wXCugsrYVVD1CJIEzgPPbzqPh8cRBuo8/exec';

const marco = document.getElementById('app');
const cargando = document.getElementById('cargando');

// ?app=1 avisa a la app que está dentro de esta página, para que el botón
// Estadísticas / ← Turnos cambie de pantalla aquí y no saque al usuario de la app instalada.
function abrir(vista) {
  cargando.classList.remove('oculto');
  marco.src = APP_URL + '?app=1' + (vista === 'jefa' ? '&vista=jefa' : '');
}
marco.addEventListener('load', () => cargando.classList.add('oculto'));

window.addEventListener('message', ev => {
  // Solo mensajes de la app de Apps Script (se sirve desde *.googleusercontent.com).
  if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(ev.origin)) return;
  const vista = ev.data && ev.data.tortasMary;
  if (vista === 'jefa' || vista === 'turnos') abrir(vista);
});

abrir('turnos');

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
